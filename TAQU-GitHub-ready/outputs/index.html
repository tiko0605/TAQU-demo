<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7faf7" />
  <title>它趣 TAQU · 和它，一起发现城市</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-label="它趣正在打开">
    <div class="splash-art" aria-hidden="true">
      <div class="splash-pet splash-dog"><span>🐕</span></div>
      <div class="splash-pet splash-cat"><span>🐈</span></div>
    </div>
    <div class="splash-brand"><span>它趣</span><b>TAQU</b><small>和它，一起发现城市</small></div>
    <div class="splash-loading"><span></span><span></span><span></span></div>
  </div>

  <div id="app" class="app-shell is-hidden">
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="主导航">
      <button data-nav="home" class="nav-item active"><i data-lucide="map"></i><span>地图</span></button>
      <button data-nav="community" class="nav-item"><i data-lucide="users"></i><span>社区</span></button>
      <button data-nav="rescue" class="nav-item"><i data-lucide="heart-handshake"></i><span>救助</span></button>
      <button data-nav="favorites" class="nav-item"><i data-lucide="bookmark"></i><span>收藏</span></button>
      <button data-nav="profile" class="nav-item"><i data-lucide="user-round"></i><span>我的</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="app.js"></script>
</body>
</html>
